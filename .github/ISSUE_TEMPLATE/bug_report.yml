name: Bug report
description: Report a reproducible problem without sharing private Codex data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach auth.json, access tokens, raw conversations, source code, or a real database.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.5.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Codex surface
      options: [Desktop, CLI, Both]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted metadata only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, prompts, responses, source code, session IDs, account IDs, and project paths.
          required: true
